# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: device
  - override /model: mvit
  - override /callbacks: default
  - override /trainer: default
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["famli", "tran_fetal_presentation"]

seed: 442

trainer:
  accelerator: gpu
  precision: 16-mixed
  benchmark: true
  accumulate_grad_batches: 4
  log_every_n_steps: 10
  min_epochs: 30
  max_epochs: 1000

model:
  optimizer:
    lr: 0.00003
  compile: false
  output_dir: ${paths.output_dir}
  net:
    num_classes: 2
  num_classes: 2
  loss_weights: 1.0
data:
  _target_: src.data.base_datamodule.BalancedDataModule
  batch_size: 8
  train_dataset:
    spatial_size: 224
  val_dataset:
    spatial_size: 224
  test_dataset:
    spatial_size: 224

logger:
  wandb:
    group: "mvit"
    tags: "${tags}"
    name: "mvit-${device}" 
  aim:
    experiment: "mvit-${device}" 

experiment:
  name: "mvit-${device}" 



