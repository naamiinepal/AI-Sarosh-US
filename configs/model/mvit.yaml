_target_: src.models.famli_module.FAMLITrainingModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.00003
  weight_decay: 0.001

# config.yaml
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_ : true
  mode: max
  factor: 0.1
